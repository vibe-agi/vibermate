<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="shell" x1="176" y1="112" x2="848" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18314B"/>
      <stop offset="1" stop-color="#0B1D30"/>
    </linearGradient>
    <linearGradient id="request" x1="238" y1="424" x2="786" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62DCC7"/>
      <stop offset="1" stop-color="#2CC0AE"/>
    </linearGradient>
    <linearGradient id="response" x1="786" y1="424" x2="238" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70B9EE"/>
      <stop offset="1" stop-color="#438FD0"/>
    </linearGradient>
  </defs>

  <!-- A quiet flight-recorder shell. The transparent optical margin lets macOS
       apply its own icon silhouette without clipping the body. -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shell)"/>
  <rect x="84" y="84" width="856" height="856" rx="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="6"/>

  <!-- Request and response exchange lanes pass behind one audit recorder. -->
  <path d="M238 424H402C460 424 488 458 488 512C488 566 516 600 574 600H786" fill="none" stroke="url(#request)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M786 424H622C564 424 536 458 536 512C536 566 508 600 450 600H238" fill="none" stroke="url(#response)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A restrained record lamp marks the durable evidence. -->
  <circle cx="512" cy="512" r="70" fill="#102943" stroke="#58748C" stroke-width="7"/>
  <circle cx="512" cy="512" r="25" fill="#FFB627"/>
  <circle cx="504" cy="504" r="7" fill="#FFD978"/>
</svg>
