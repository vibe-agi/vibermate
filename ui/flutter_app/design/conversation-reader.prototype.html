<body>
<div class="app" id="app">
  <header class="chrome"><span class="brand-mark">V</span><span class="brand">ViberMate</span><span class="crumb">运行记录　/　codex</span><span class="preview-mark">临时设计 v2 · 全部为演示数据</span></header>
  <div class="shell">
    <aside class="rail" aria-hidden="true"><span data-icon="grid"></span><span class="on" data-icon="chat"></span><span data-icon="chart"></span><span data-icon="settings"></span></aside>
    <main class="screen">
      <header class="session-header">
        <div class="row"><div class="agent-icon" data-icon="spark"></div><div><h1>codex</h1><div class="session-meta">vibermate · vibermate run <span class="dot"></span>运行中</div></div><span class="spacer"></span><div class="session-right">ChatGPT　·　general</div></div>
        <nav class="navigation" aria-label="记录视图"><button class="active" data-nav="conversation" aria-pressed="true">对话</button><button data-nav="requests" aria-pressed="false">请求记录</button></nav>
      </header>
      <div class="workspace" id="workspace">
        <div class="reader-column" id="reader-column">
          <div class="reading-head"><h2 id="reading-title">优化对话阅读体验</h2><span class="thread-label">主 Agent · <span id="request-count">54</span> 次请求</span><span class="usage-summary" id="usage-summary" aria-label="本段已采集用量"></span></div>
          <section class="reader" id="reader" tabindex="0" aria-label="对话正文"><div class="reading-column" id="conversation"></div></section>
          <section class="requests-view hidden" id="requests" aria-label="请求记录"></section>
          <button class="unread-button hidden" id="unread-button"></button>
        </div>
        <aside class="inspector" id="inspector" aria-label="所选消息的详情">
          <div class="empty-inspector" id="empty-inspector"><div class="hint-line"><span data-icon="left"></span>从消息旁查看详情</div><p>选择一次工具调用或一条回复的上下文。正文留在原位，详情在这里打开。</p></div>
          <div class="inspector-content hidden" id="inspector-content">
            <header class="inspector-head" id="inspector-head"></header>
            <nav class="inspector-tabs" id="inspector-tabs" aria-label="详情内容"></nav>
            <div class="inspector-scroll" id="inspector-scroll" tabindex="0"></div>
            <div class="live-note hidden" id="live-note"><button id="live-return"></button></div>
          </div>
        </aside>
      </div>
    </main>
  </div>

   const total=id==='51'?650:id==='52'?652:654;title=`请求 #${id} 的上下文`;breadcrumb='主 Agent / 所选消息 / 请求上下文';source=`仅此请求 · ${id==='53'?'对应这条正文回复':'对应所选消息'} · gpt-5.4`;tabs=tabButtons([['system','系统指令 · 2'],['history',`历史 · ${total}`],['raw','原始数据']]);
   if(currentTab()==='system')body=`<p class="detail-note">请求 #${id} 实际携带的指令，独立于对话正文。以下使用演示文本。</p>${[['system','System','顶层 instructions','You are a coding assistant.\nHelp the user understand the project and make well-scoped changes.'],['developer','Developer','输入消息',`先理解请求和返回中的内容类型。\n保持用户已有修改。\n${id==='51'?'先检查共享消息组件，再说明设计。':'这次只制作设计原型，不改产品代码。'}\n没有记录的内容不得推测或补全。`]].map(([key,label,origin,text])=>`<details class="disclosure" data-disclosure="${id}:${key}" ${disclosures[id+':'+key]?'open':''}><summary>${label}<span class="scope-tag">${origin}</span></summary><div class="instruction">${esc(text)}</div></details>`).join('')}<div class="detail-callout">切换其他消息时，请求编号也会变化。不会把某一份提示词误当成整场对话共用的提示词。</div>`;
   else if(currentTab()==='history')body=`<div class="detail-callout"><strong>完整请求快照 · ${total} 条消息</strong><br>这是发送给模型的上下文，不是本次新增的 ${total} 条对话。</div><p class="detail-note">以下 6 条仅为布局演示节选。保留原始顺序，工具结果保持工具身份。</p>${[['用户','先检查一下现有的消息渲染。'],['Agent · 过程消息','我先查看共享组件及其调用方。'],['Agent · tool_call','exec_command · call_51_read'],['工具结果','call_51_read · exit_code: 0'],['用户','先给我看设计，不要直接修改产品代码。'],['Agent','将正文和执行证据分开阅读。']].map(([role,text],i)=>`<div class="history-item"><div class="history-role">${i+1} · ${role}</div><p>${text}</p></div>`).join('')}<p class="detail-note">查看历史不会把这些消息再次插入正文。无法确认新增输入时，正文会明确说明。</p>`;
   else{const side=rawViews[id]||'response';body=`<p class="detail-note">请求 #${id} 的原始数据示意。仅使用模拟字段，不含真实对话或账号凭证。</p><div class="raw-toggle"><button data-raw-side="request" class="${side==='request'?'active':''}" aria-pressed="${side==='request'}">请求</button><button data-raw-side="response" class="${side==='response'?'active':''}" aria-pressed="${side==='response'}">返回</button></div><pre class="code-box">${esc(JSON.stringify(side==='request'?{model:'gpt-5.4',instructions:'[已记录的 System 指令]',input:[{role:'developer',content:'[Developer 指令]'},{role:'user',content:'[历史与新增输入示意]'}]}:{id:`resp_demo_${id}`,status:'completed',output:id==='51'||id==='52'?[{type:'function_call',name:'exec_command',call_id:id==='51'?'call_51_read':'call_52_search',arguments:'[已记录的参数]'}]:[{type:'message',role:'assistant',content:[{type:'output_text',text:'将对话正文和执行细节分开阅读。'}]}]},null,2))}</pre>`;}
 }else if(type==='usage'){
   title=id==='segment'?'本段用量与费用':id==='child-1'?'检查 Agent · 用量与费用':`请求 #${id} · 用量与费用`;breadcrumb=id==='segment'?'所示片段 / 已采集用量':'所选请求 / 已采集用量';source=id==='segment'?`打开时快照 · ${segmentUsageRecords().length} 次请求 · API 等价估算`:'API 等价估算 · USD · 不等于实际扣款';body=usageDetails(id);
 }else if(type==='reasoning'){
   title='已记录的思考摘要';breadcrumb=`主 Agent / 正文回复 / 请求 #${id}`;source='摘要内容 · 不属于最终答复';body='<p class="detail-note">仅展示接口实际提供的可见摘要。不猜测、不还原未提供的内部思考。以下为演示文本。</p><div class="history-item"><div class="history-role">可见摘要</div><p>保持对话的时间顺序，把执行细节关联到相应消息。工具输出、系统指令和历史快照不混入用户可读的正文。</p></div>';
 }else{
   title='检查 Agent';breadcrumb='主 Agent / 子线程 / 阅读布局检查';source='agent_reviewer · 已完成 · 与主对话分开';body='<div class="detail-callout">子 Agent 的独立线程。下面的内容不冒充主 Agent 的回复。</div><div class="child-message"><div class="who">主 Agent → 检查 Agent</div>只检查阅读布局，说明工具记录与正文怎样关联。不要修改产品代码。</div><div class="child-message"><div class="who">检查 Agent · 正文回复</div>建议将工具调用放在就近的执行记录里。用 call_id 配对结果，并在详情面板注明源请求。正文只保留用户输入与 Agent 的可见消息。</div><button class="child-return" data-close>← 返回主对话原位置</button>';
 }
 if(type==='tool')body+=`<button class="request-usage-link" data-inspect="usage" data-id="${toolByID(id).request}">查看发起请求 #${toolByID(id).request} 的 Token 与费用 →</button><p class="usage-note">工具结果不是新的独立模型请求，不按本页面的展示次数累加费用。</p>`;
 if(type==='agent')body+=`<div class="message-actions">${usageBadge('child-1','子线程请求')}</div><p class="usage-note">已包含在本段汇总中，不会再次叠加。</p>`;
 $('inspector-head').innerHTML=`<div class="inspector-breadcrumb">${esc(breadcrumb)}</div><div class="row"><h2 id="inspector-title" tabindex="-1">${esc(title)}</h2><span class="spacer"></span><button class="close-inspector" data-close>${svg('left')}返回对话</button></div><div class="inspector-source">${esc(source)}</div>`;
 $('inspector-tabs').innerHTML=tabs;$('inspector-tabs').classList.toggle('hidden',!tabs);panel.innerHTML=body;panel.scrollTop=scrolls[scrollKey()]||0;
 panel.querySelectorAll('[data-disclosure]').forEach(el=>el.addEventListener('toggle',()=>{if(el.isConnected)disclosures[el.dataset.disclosure]=el.open;}));
 updateUnread();
}
function setPanelTab(tab){savePanel();if(selection.type==='tool')toolViews[selection.id]=tab;else contextViews[selection.id]=tab;renderInspector();refreshHighlights();document.querySelector(`[data-panel-tab="${tab}"]`)?.focus({preventScroll:true});updatePreviewState();}
function updateUnread(){$('unread-button').classList.toggle('hidden',unread===0);$('unread-button').innerHTML=`${unread} 条新回复 ${svg('down')}`;$('live-note').classList.toggle('hidden',unread===0);$('live-return').textContent=`有 ${unread} 条新回复 · 返回对话查看 →`;}
function updatePreviewState(){const label=selection?selection.type==='tool'?`${toolByID(selection.id).name} · ${currentTab()==='args'?'入参':currentTab()==='result'?'返回':'原始块'}`:selection.type==='request'?`请求 #${selection.id} · ${currentTab()==='system'?'系统指令':currentTab()==='history'?'历史':'原始数据'}`:selection.type==='usage'?'Token / API 等价估算':selection.type==='agent'?'检查 Agent · 子线程':'已记录的思考摘要':'未选择详情';$('preview-state').textContent=`${view==='conversation'?'正文':'请求记录'} · ${label}`;}
function showLatest(){if(selection)closeInspector({restoreFocus:false});navigate('conversation');reader.scrollTop=reader.scrollHeight;unread=0;updateUnread();reader.focus({preventScroll:true});}
function simulateReply(){
 const follow=!selection&&view==='conversation'&&reader.scrollHeight-reader.clientHeight-reader.scrollTop<32;
 const before=view==='conversation'?captureAnchor():null;newReplies++;const request=Number($('request-count').textContent)+1;
 $('conversation').insertAdjacentHTML('beforeend',message(`message-live-${newReplies}`,'Agent',`<p>这是第 ${newReplies} 条模拟新增回复。${selection?'你正在查看的详情保持不变，工具页签和滚动位置也不会被替换。':'已有内容保留原位；只有在正文底部阅读时才自动跟随。'}</p>`,{request,stage:'新记录',actions:contextualActions(request)}));
 $('request-count').textContent=request;renderUsageSummary();refreshHighlights();if(follow){reader.scrollTop=reader.scrollHeight;unread=0;}else{restoreAnchor(before);unread++;}updateUnread();
}
function navigate(next){if(view===next)return;if(view==='conversation')conversationPosition=captureAnchor();view=next;$('reader').classList.toggle('hidden',view!=='conversation');$('requests').classList.toggle('hidden',view!=='requests');$('reading-title').textContent=view==='conversation'?'优化对话阅读体验':'请求记录 · 演示节选';document.querySelectorAll('[data-nav]').forEach(el=>{el.classList.toggle('active',el.dataset.nav===view);el.setAttribute('aria-pressed',String(el.dataset.nav===view));});if(view==='conversation')restoreAnchor(conversationPosition);updatePreviewState();}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2400);}
function resetScenario(next){
 if(selection)closeInspector({restoreFocus:false});navigate('conversation');scenario=next;toolViews={};contextViews={};rawViews={};scrolls={};disclosures={};unread=0;newReplies=0;anchor=null;conversationPosition=null;
 $('conversation').innerHTML=conversation();$('request-count').textContent=scenario==='tools'?52:scenario==='checkpoint'?53:54;reader.scrollTop=0;
 $('requests').innerHTML='<p class="detail-note">一条用户任务可能产生多次请求。这里保留请求粒度，不把请求次数等同于对话轮数。</p>'+[51,52,53].filter(n=>scenario!=='tools'||n!==53).map(n=>`<div class="request-row"><button data-inspect="request" data-id="${n}">#${n}</button><div class="description">${n===51?'过程消息 + 读取工具调用':n===52?'工具结果输入 + 后续调用':'Agent 正文回复'}</div><span class="${n===52&&scenario==='tools'?'amber':'green'} tiny">${n===52&&scenario==='tools'?'未观察到工具结果':'已记录'}</span></div>`).join('');
 renderUsageSummary();updateUnread();updatePreviewState();
}
document.addEventListener('click',async event=>{
 const target=event.target.closest('button');if(!target)return;
 if(target.dataset.inspect){showInspector(target.dataset.inspect,target.dataset.id,target.dataset.tab,target);return;}
 if(target.hasAttribute('data-close')){closeInspector();return;}
 if(target.dataset.panelTab){setPanelTab(target.dataset.panelTab);return;}
 if(target.dataset.rawSide){savePanel();const side=target.dataset.rawSide;rawViews[selection.id]=side;renderInspector();document.querySelector(`[data-raw-side="${side}"]`)?.focus({preventScroll:true});return;}
 if(target.dataset.nav){if(selection)closeInspector({restoreFocus:false});navigate(target.dataset.nav);return;}
 if(target.hasAttribute('data-copy-message')){const body=target.closest('article').querySelector('.body,.user-body').innerText;try{await navigator.clipboard.writeText(body);toast('已复制这条消息的正文');}catch{toast('当前预览无法写入剪贴板，请选择正文复制');}}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&selection){event.preventDefault();closeInspector();}});
narrow.addEventListener('change',()=>{if(selection&&narrow.matches&&view==='conversation')anchor=captureAnchor();setNarrowState();if(selection&&narrow.matches)$('inspector-title').focus({preventScroll:true});});
$('scenario').addEventListener('change',event=>resetScenario(event.target.value));
$('simulate').onclick=simulateReply;$('unread-button').onclick=showLatest;$('live-return').onclick=showLatest;
reader.addEventListener('scroll',()=>{if(unread&&!selection&&view==='conversation'&&reader.scrollHeight-reader.clientHeight-reader.scrollTop<24){unread=0;updateUnread();}},{passive:true});
resetScenario('normal');
</script>
</body>
</html>
