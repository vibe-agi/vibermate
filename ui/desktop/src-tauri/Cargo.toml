[package]
name = "vibermate-desktop"
version = "0.1.0"
description = "Native shell for the local VibeMate runtime"
license = "Apache-2.0"
authors = ["vibermate contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "vibermate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.189"
reqwest = { version = "=0.13.4", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tokio = { version = "=1.53.1", features = ["macros", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
