# This release-runner workflow builds and exercises one clean macOS arm64
# release-profile App with native Keychain storage and the catalogued Claude
# Code 2.1.220 executable.
# It downloads only the pinned isolated native client package, does not use a
# provider credential, install a Root,
# change the system proxy, sign/notarize, test installers, or grant Preview or
# Release approval. Those remain separate gates.
name: packaged deterministic acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibermate-packaged-deterministic
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: clean release-profile App + fixed Claude + fresh verifier
    environment: packaged-acceptance
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      DESKTOP_APP: ${{ github.workspace }}/dist/ViberMate.app

    steps:
      - name: Check out the selected candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Establish isolated acceptance paths
        shell: bash
        run: |
          set -euo pipefail
          acceptance_root="${RUNNER_TEMP}/vibermate-packaged-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            printf 'ACCEPTANCE_ROOT=%s\n' "${acceptance_root}"
            printf 'ACCEPTANCE_BIN=%s/vibermate-acceptance\n' "${acceptance_root}"
            printf 'VERIFY_BIN=%s/vibermate-acceptance-verify\n' "${acceptance_root}"
            printf 'REPORT_PATH=%s/deterministic-v7.json\n' "${acceptance_root}"
          } >> "${GITHUB_ENV}"
          install -d -m 0700 "${acceptance_root}"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1

      - name: Install the fixed Claude package in the private acceptance root
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund \
            --prefix "${ACCEPTANCE_ROOT}/client" \
            --cache "${ACCEPTANCE_ROOT}/npm-cache" \
            @anthropic-ai/claude-code-darwin-arm64@2.1.220
          fixed_claude="${ACCEPTANCE_ROOT}/client/node_modules/@anthropic-ai/claude-code-darwin-arm64/claude"
          test -f "${fixed_claude}"
          test ! -L "${fixed_claude}"
          test -x "${fixed_claude}"
          test "$(shasum -a 256 "${fixed_claude}" | awk '{print $1}')" = "8addc857f3fe64d5a0368af9ee50321b50afb4a6918ba3ef018ab84f5dbbe081"
          test "$(node -p 'require(process.argv[1]+"/package.json").version' "${ACCEPTANCE_ROOT}/client/node_modules/@anthropic-ai/claude-code-darwin-arm64")" = "2.1.220"
          node -e 'const p=require(process.argv[1]); if (p.packages["node_modules/@anthropic-ai/claude-code-darwin-arm64"].integrity !== "sha512-rmtd41Bf+n+YnhjSjtQ8WG5qy8KKogUp3YRfQrkLsTgPUD0H3j869rBInBJT3SHrKQ0hLghQLGM73CC1C+USLQ==") process.exit(1)' "${ACCEPTANCE_ROOT}/client/package-lock.json"
          printf 'FIXED_CLAUDE_PATH=%s\n' "${fixed_claude}" >> "${GITHUB_ENV}"

      - name: Install the pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter_root="${RUNNER_TEMP}/vibermate-flutter-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ui/flutter_app/tool/install_ci_flutter.sh "${flutter_root}"
          printf '%s/bin\n' "${flutter_root}" >> "${GITHUB_PATH}"
          printf 'FLUTTER_ROOT=%s\n' "${flutter_root}" >> "${GITHUB_ENV}"
      - name: Install the locked CocoaPods version
        run: bash ui/flutter_app/tool/install_ci_cocoapods.sh

      - name: Prove the isolated runner inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -n "${FIXED_CLAUDE_PATH}"
          test "${FIXED_CLAUDE_PATH}" = "${ACCEPTANCE_ROOT}/client/node_modules/@anthropic-ai/claude-code-darwin-arm64/claude"
          test -f "${FIXED_CLAUDE_PATH}"
          test -x "${FIXED_CLAUDE_PATH}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          install -d -m 0700 "${ACCEPTANCE_ROOT}"
          VIBERMATE_OFFICIAL_CLAUDE="${FIXED_CLAUDE_PATH}" \
            go test -count=1 -run '^TestOfficialInstalledClientPackagesMatchTheBuiltInCatalog$/^Claude_Code$' ./internal/clientadapter

      - name: Build the selected packaged candidate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ui/flutter_app/tool/build_macos_app.sh live
          ui/flutter_app/tool/verify_macos_app.sh "${DESKTOP_APP}" live
          go build -buildvcs=true -trimpath -o "${ACCEPTANCE_BIN}" ./cmd/vibermate-acceptance
          go build -buildvcs=true -trimpath -o "${VERIFY_BIN}" ./cmd/vibermate-acceptance-verify

      - name: Run deterministic packaged acceptance
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          "${ACCEPTANCE_BIN}" \
            --desktop-app "${DESKTOP_APP}" \
            --claude "${FIXED_CLAUDE_PATH}" \
            --deterministic-only \
            --report "${REPORT_PATH}" \
            --timeout 10m

      - name: Reject missing, failed, malformed, or stale evidence
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "${VERIFY_BIN}" \
            --report "${REPORT_PATH}" \
            --expected-mode deterministic \
            --expected-schema vibermate.m0-assembly-acceptance/v7 \
            --expected-revision "${GITHUB_SHA}" \
            --expected-client-id claude-code \
            --expected-client-version 2.1.220 \
            --source-root "${GITHUB_WORKSPACE}" \
            --desktop-app "${DESKTOP_APP}" \
            --acceptance-executable "${ACCEPTANCE_BIN}" \
            --client-entrypoint "${FIXED_CLAUDE_PATH}"

      - name: Retain the private report for bounded review
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-packaged-deterministic-v7-${{ github.sha }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove private runner state
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          expected_root="${RUNNER_TEMP}/vibermate-packaged-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -n "${ACCEPTANCE_ROOT:-}"
          test "${ACCEPTANCE_ROOT}" = "${expected_root}"
          rm -rf -- "${ACCEPTANCE_ROOT}"
