# Deterministic CI runs module and generation drift, structural checks, unit
# tests, browser tests, race tests, contract tests, vet, and govulncheck. It does not run real
# Agent/provider traffic, the opt-in packaged-app acceptance sequence, platform
# Root or proxy changes, signing, installers, long-duration soak, or
# external-version drift. Those gates require a frozen macOS arm64 artifact and
# a separately authorized acceptance runner.
name: validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  generated-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
      - name: Verify generated files
        run: |
          go generate ./...
          git diff --exit-code
      - name: Verify module files
        run: go mod tidy -diff
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Run structural checks and scanner self-tests
        run: |
          go run ./cmd/repositorycheck
          go test ./internal/repositorycheck
      - name: Verify GitHub Actions workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          node --test .github/check-action-pins.test.mjs
          node .github/check-action-pins.mjs
      - name: Verify Flutter distribution and macOS release tooling
        run: node --test ui/flutter_app/tool/desktop_build_manifest.test.mjs tool/macos-release/*.test.mjs tool/docker/compose.test.mjs
      - name: Verify packaged acceptance contract
        run: node --test .github/packaged-acceptance-contract.test.mjs

  unit:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go test ./...
      - run: go vet ./...

  paseo-plugin:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: integrations/paseo/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: integrations/paseo
      - run: npm run typecheck
        working-directory: integrations/paseo
      - run: npm test
        working-directory: integrations/paseo

  linux-client-compatibility:
    needs: generated-structural
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
      - name: Install and verify the exact supported Linux clients
        shell: bash
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vibermate-official-clients-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npm install --prefix "${prefix}" \
            @anthropic-ai/claude-code@2.1.220 \
            @openai/codex@0.145.0
          VIBERMATE_OFFICIAL_CLAUDE="${prefix}/node_modules/.bin/claude" \
          VIBERMATE_OFFICIAL_CODEX="${prefix}/node_modules/.bin/codex" \
            go test -count=1 -run '^TestOfficialInstalledClientPackagesMatchTheBuiltInCatalog$' \
              ./internal/clientadapter
  codex-current-compatibility:
    needs: generated-structural
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
      - name: Exercise current Codex wire through the launcher and production codec
        shell: bash
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vibermate-current-codex-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npm install --ignore-scripts --prefix "${prefix}" @openai/codex@0.159.2
          codex_binary="$(find "${prefix}/node_modules" -type f -path '*/vendor/*/bin/codex')"
          test -f "${codex_binary}"
          test "$("${codex_binary}" --version)" = 'codex-cli 0.159.2'
          export VIBERMATE_CODEX_ACCEPTANCE="${codex_binary}"
          go test -count=1 -run '^TestInstalledCodexRecoversTransientHTTPFailureThroughLauncher$' ./internal/runlauncher
          go test -count=1 -run '^TestInstalledCodex' ./internal/loopbackproxy

  race:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      # Short mode retains functional, concurrent read/write and isolation
      # checks; dedicated jobs below race full crash and response matrices.
      - run: go test -race -short ./...

  store-crash-race:
    needs: generated-structural
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: make test-store-crash-race

  store-response-race:
    needs: generated-structural
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      # The per-test 40m watchdog contains execution, not product latency.
      - run: make test-store-response-race

  native-release-build:
    needs: generated-structural
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
      - name: Prove native release inputs
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          case "$(sw_vers -productVersion)" in 15.*) ;; *) echo "macOS 15 required" >&2; exit 1 ;; esac
          case "$(sw_vers -buildVersion)" in 24*) ;; *) echo "Darwin 24/macOS build24 required" >&2; exit 1 ;; esac
          test "$(xcodebuild -version)" = $'Xcode 16.2\nBuild version 16C5032a'
          test "$(xcrun --sdk macosx --show-sdk-version)" = 15.2
          test "$(go version)" = 'go version go1.26.8 darwin/arm64'
          test "$(node --version)" = v22.23.1
      - run: make check-release-build
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -tags vibermate_native_secrets ./...

  contracts:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Run runtime, protocol, egress, host, and persistence contracts
        run: |
          go test -count=1 ./internal/activity
          go test -count=1 ./internal/productruntime
          go test -count=1 ./internal/hostcontract
          go test -count=1 ./internal/runtimepersistence
          go test -count=1 ./internal/protocolcore
          go test -count=1 ./internal/ssewire
          go test -count=1 ./internal/anthropicchat
          go test -count=1 ./internal/offlinehold
          go test -count=1 ./internal/secretstore
          go test -count=1 ./internal/hostsecret
          go test -count=1 ./internal/providertransport
          go test -count=1 ./internal/originaltransport
          go test -count=1 ./internal/exchange
          go test -count=1 ./internal/capturerun
          go test -count=1 ./internal/capturecontrol
          go test -count=1 ./internal/clientadapter
          go test -count=1 ./internal/acceptancereport
          go test -count=1 ./internal/connectionevent
          go test -count=1 ./internal/localca
          go test -count=1 ./internal/pathcapability
          go test -count=1 ./internal/loopbackproxy
          go test -count=1 ./internal/loopbackclient
          go test -count=1 ./internal/desktopbootstrap
          go test -count=1 ./internal/desktopcontrol
          go test -count=1 ./internal/desktopdaemon
          go test -count=1 ./internal/desktophost
          go test -count=1 ./internal/instanceguard
          go test -count=1 ./internal/runlauncher
          go test -count=1 ./internal/runtimepath
          go test -count=1 ./internal/toolapproval
          go test -count=1 ./cmd/vibermate-acceptance
          go test -count=1 ./cmd/vibermate-acceptance-verify

  desktop:
    needs: generated-structural
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Install the pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter_root="${RUNNER_TEMP}/vibermate-flutter-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ui/flutter_app/tool/install_ci_flutter.sh "${flutter_root}"
          printf '%s/bin\n' "${flutter_root}" >> "${GITHUB_PATH}"
          printf 'FLUTTER_ROOT=%s\n' "${flutter_root}" >> "${GITHUB_ENV}"
      - name: Install the locked CocoaPods version
        run: bash ui/flutter_app/tool/install_ci_cocoapods.sh
      - name: Verify Flutter workbench and contracts
        shell: bash
        working-directory: ui/flutter_app
        run: |
          set -euo pipefail
          tool/verify_flutter_sdk.sh
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter pub deps --no-dev --style=compact
      - name: Verify native macOS preference boundary
        timeout-minutes: 5
        shell: bash
        working-directory: ui/flutter_app
        run: |
          set -euo pipefail
          flutter build macos --debug --config-only
          # These tests share one App host. Xcode 15 can hang while cancelling
          # a spare parallel Flutter host after all test classes have passed.
          xcodebuild test \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -resultBundlePath "${RUNNER_TEMP}/vibermate-native-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Retain native test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-test-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vibermate-native-tests.xcresult
            ~/Library/Logs/DiagnosticReports/*
          if-no-files-found: warn
          retention-days: 3
      - name: Build and verify the packaged Flutter App
        shell: bash
        run: |
          set -euo pipefail
          ui/flutter_app/tool/build_macos_app.sh live
          ui/flutter_app/tool/verify_macos_app.sh \
            "${GITHUB_WORKSPACE}/dist/ViberMate.app" \
            live
      - name: Exercise the exact packaged daemon and CLI
        shell: bash
        working-directory: ui/flutter_app
        env:
          VIBERMATE_LIVE_TEST_DAEMON: ${{ github.workspace }}/dist/ViberMate.app/Contents/MacOS/vibermated
          VIBERMATE_LIVE_TEST_COMMAND: ${{ github.workspace }}/dist/ViberMate.app/Contents/MacOS/vibermate
          VIBERMATE_LIVE_TEST_APP: ${{ github.workspace }}/dist/ViberMate.app
        run: |
          set -euo pipefail
          flutter test test/live_runtime_test.dart
          go test -count=1 ../../cmd/vibermate-acceptance
          git diff --exit-code

  web:
    needs: generated-structural
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Install the pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter_root="${RUNNER_TEMP}/vibermate-flutter-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ui/flutter_app/tool/install_ci_flutter.sh "${flutter_root}" web
          printf '%s/bin\n' "${flutter_root}" >> "${GITHUB_PATH}"
          printf 'FLUTTER_ROOT=%s\n' "${flutter_root}" >> "${GITHUB_ENV}"
      - name: Test and build the browser workbench
        shell: bash
        working-directory: ui/flutter_app
        run: |
          set -euo pipefail
          tool/verify_flutter_sdk.sh
          flutter pub get
          flutter test --platform chrome
          tool/build_web.sh
          version="$(awk '$1 == "version:" { print $2 }' pubspec.yaml)"
          version="${version%%+*}"
          ../../tool/linux-release/build-linux-distributions.sh \
            "${version}" build/web ../../dist/linux-ci
          ../../tool/linux-release/verify-linux-distributions.sh \
            "${version}" ../../dist/linux-ci
          git diff --exit-code

  vulnerability:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
