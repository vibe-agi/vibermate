# Deterministic CI runs module and generation drift, structural checks, unit
# tests, race tests, contract tests, vet, and govulncheck. It does not run real
# Agent/provider traffic, platform Root or proxy changes, signing, installers,
# long-duration soak, or external-version drift. Those gates require later
# production and release runners.
name: validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generated-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
      - name: Verify generated files
        run: |
          go generate ./...
          node ui/desktop/scripts/sync-locales.mjs --check
          git diff --exit-code
      - name: Verify module files
        run: go mod tidy -diff
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Run structural checks and scanner self-tests
        run: |
          go run ./cmd/repositorycheck
          go test ./internal/repositorycheck

  unit:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go test ./...
      - run: go vet ./...

  race:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go test -race ./...

  contracts:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Run runtime, protocol, egress, host, and persistence contracts
        run: |
          go test -count=1 ./internal/access
          go test -count=1 ./internal/accessapply
          go test -count=1 ./internal/accesscredential
          go test -count=1 ./internal/activity
          go test -count=1 ./internal/productruntime
          go test -count=1 ./internal/hostcontract
          go test -count=1 ./internal/runtimepersistence
          go test -count=1 ./internal/protocolcore
          go test -count=1 ./internal/ssewire
          go test -count=1 ./internal/anthropicchat
          go test -count=1 ./internal/offlinehold
          go test -count=1 ./internal/secretstore
          go test -count=1 ./internal/hostsecret
          go test -count=1 ./internal/providertransport
          go test -count=1 ./internal/originaltransport
          go test -count=1 ./internal/exchange
          go test -count=1 ./internal/capturerun
          go test -count=1 ./internal/capturecontrol
          go test -count=1 ./internal/clientadapter
          go test -count=1 ./internal/connectionevent
          go test -count=1 ./internal/localca
          go test -count=1 ./internal/pathcapability
          go test -count=1 ./internal/loopbackproxy
          go test -count=1 ./internal/loopbackclient
          go test -count=1 ./internal/desktopbootstrap
          go test -count=1 ./internal/desktopcontrol
          go test -count=1 ./internal/desktopdaemon
          go test -count=1 ./internal/desktophost
          go test -count=1 ./internal/instanceguard
          go test -count=1 ./internal/launcherdiscovery
          go test -count=1 ./internal/runlauncher
          go test -count=1 ./internal/runtimepath
          go test -count=1 ./internal/toolapproval

  desktop:
    needs: generated-structural
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: ui/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Verify Desktop UI
        run: |
          pnpm --dir ui/desktop install --frozen-lockfile
          pnpm --dir ui/desktop check
      - name: Verify Desktop native shell
        run: |
          pnpm --dir ui/desktop prepare:desktop
          cargo fmt --manifest-path ui/desktop/src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path ui/desktop/src-tauri/Cargo.toml
      - name: Scan Desktop Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file ui/desktop/src-tauri/Cargo.lock

  vulnerability:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
