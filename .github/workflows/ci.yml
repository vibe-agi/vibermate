# Deterministic CI runs module and generation drift, structural checks, unit
# tests, race tests, contract tests, vet, and govulncheck. It does not run real
# Agent/provider traffic, the opt-in packaged-app acceptance sequence, platform
# Root or proxy changes, signing, installers, long-duration soak, or
# external-version drift. Those gates require a frozen macOS arm64 artifact and
# a separately authorized acceptance runner.
name: validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generated-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
      - name: Verify generated files
        run: |
          go generate ./...
          node ui/desktop/scripts/sync-generated.mjs --check
          git diff --exit-code
      - name: Verify module files
        run: go mod tidy -diff
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Run structural checks and scanner self-tests
        run: |
          go run ./cmd/repositorycheck
          go test ./internal/repositorycheck
      - name: Verify GitHub Actions workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          node --test .github/check-action-pins.test.mjs
          node .github/check-action-pins.mjs

  unit:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go test ./...
      - run: go vet ./...

  race:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go test -race ./...

  contracts:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Run runtime, protocol, egress, host, and persistence contracts
        run: |
          go test -count=1 ./internal/access
          go test -count=1 ./internal/accessapply
          go test -count=1 ./internal/accesscredential
          go test -count=1 ./internal/activity
          go test -count=1 ./internal/productruntime
          go test -count=1 ./internal/hostcontract
          go test -count=1 ./internal/runtimepersistence
          go test -count=1 ./internal/protocolcore
          go test -count=1 ./internal/ssewire
          go test -count=1 ./internal/anthropicchat
          go test -count=1 ./internal/offlinehold
          go test -count=1 ./internal/secretstore
          go test -count=1 ./internal/hostsecret
          go test -count=1 ./internal/providertransport
          go test -count=1 ./internal/originaltransport
          go test -count=1 ./internal/exchange
          go test -count=1 ./internal/capturerun
          go test -count=1 ./internal/capturecontrol
          go test -count=1 ./internal/clientadapter
          go test -count=1 ./internal/acceptancereport
          go test -count=1 ./internal/connectionevent
          go test -count=1 ./internal/localca
          go test -count=1 ./internal/pathcapability
          go test -count=1 ./internal/loopbackproxy
          go test -count=1 ./internal/loopbackclient
          go test -count=1 ./internal/desktopbootstrap
          go test -count=1 ./internal/desktopcontrol
          go test -count=1 ./internal/desktopdaemon
          go test -count=1 ./internal/desktophost
          go test -count=1 ./internal/instanceguard
          go test -count=1 ./internal/launcherdiscovery
          go test -count=1 ./internal/runlauncher
          go test -count=1 ./internal/runtimepath
          go test -count=1 ./internal/toolapproval
          go test -count=1 ./cmd/vibermate-acceptance
          go test -count=1 ./cmd/vibermate-acceptance-verify

  desktop:
    needs: generated-structural
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: ui/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Verify Desktop UI
        run: |
          pnpm --dir ui/desktop install --frozen-lockfile
          pnpm --dir ui/desktop check
          pnpm --dir ui/desktop exec playwright install chromium
          pnpm --dir ui/desktop check:browser
      - name: Scan Desktop production dependencies
        run: pnpm --dir ui/desktop audit --prod --audit-level high
      - name: Verify Desktop native shell
        run: |
          pnpm --dir ui/desktop prepare:desktop
          pnpm --dir ui/desktop prepare:sidecars:distribution
          cargo fmt --manifest-path ui/desktop/src-tauri/Cargo.toml --check
          cargo clippy --locked --all-targets --manifest-path ui/desktop/src-tauri/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path ui/desktop/src-tauri/Cargo.toml
          cargo check --locked --manifest-path ui/desktop/src-tauri/Cargo.toml --target aarch64-apple-darwin
          cargo check --locked --manifest-path ui/desktop/src-tauri/Cargo.toml --target x86_64-apple-darwin
      - name: Scan Desktop Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            if ! target_glib="$(cargo tree --locked --manifest-path ui/desktop/src-tauri/Cargo.toml --target "$target" -i glib)"; then
              echo "could not inspect glib reachability in $target"
              exit 1
            fi
            if [ -n "$target_glib" ]; then
              echo "RUSTSEC-2024-0429 is reachable in $target"
              exit 1
            fi
          done
          cargo audit --file ui/desktop/src-tauri/Cargo.lock --target-arch aarch64 --target-os macos --deny unsound --ignore RUSTSEC-2024-0429
          cargo audit --file ui/desktop/src-tauri/Cargo.lock --target-arch x86_64 --target-os macos --deny unsound --ignore RUSTSEC-2024-0429

  vulnerability:
    needs: generated-structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
