<div class="topbar"><span class="logo" aria-hidden="true">⌁</span>ViberMate<span class="right">设计草图 · 不连接真实环境 · 不保存任何数据</span></div>
<div class="backdrop" aria-hidden="true"><div class="rail">◉<br>▥<br>☷</div><div class="background-page"><div class="fake-tabs"><span>流量策略</span><span>上游服务</span><span>上游账号</span><span>脚本库</span></div><div class="fake-row">编辑 work　<span class="pill">草稿</span></div></div></div>
<main class="stage"><section class="modal" aria-labelledby="title">
  <header class="modal-header"><span class="title-icon" id="terminal-icon"></span><div><h1 id="title">子进程环境变量</h1><p>控制新启动的 Agent 可以继承哪些变量。</p></div><button class="icon ghost help" data-action="help" aria-label="作用范围与安全边界">ⓘ</button><button class="icon ghost" data-action="cancel" aria-label="关闭草图">✕</button></header>
  <nav class="tabs" aria-label="环境变量规则"><button id="block-tab" data-tab="block" class="active">不传给 Agent <span class="count" id="tab-count">3</span></button><button id="set-tab" data-tab="set">添加 / 覆盖 <span class="count" id="set-count">0</span></button></nav>
  <div class="main"><div class="source"><span id="source-icon"></span><span>查看来源</span><select id="source" aria-label="变量快照来源"><option value="local">本机启动终端 · 示例快照</option><option value="remote">远程 CLI · 仅变量名</option><option value="none">尚无启动快照</option></select><button class="icon ghost" data-action="refresh" aria-label="刷新示例快照">↻</button><span class="demo">DEMO · 示例数据</span></div><div id="content"></div><div id="path-warning"></div><details class="managed"><summary><span id="lock-icon"></span>连接与凭据变量由 ViberMate 管理<span class="chevron">⌄</span></summary><div class="managed-body"><div class="managed-item"><code>HTTP_PROXY / HTTPS_PROXY</code><span>代理连接 · 不在此编辑</span></div><div class="managed-item"><code>SSL_CERT_FILE</code><span>证书信任 · 按 CLI 设置</span></div><div class="managed-item"><code>VIBERMATE_*</code><span>运行时专用 · 不在此编辑</span></div></div></details></div>
  <footer class="footer"><div class="summary" id="summary"></div><button class="ghost" data-action="cancel">取消</button><button class="primary" data-action="save" id="save">保存到策略草稿</button></footer>
</section></main>
<div class="switcher" aria-label="仅用于设计评审的方案切换器"><button class="ghost" data-action="prev" aria-label="上一方案">←</button><div class="label" id="variant-label"></div><button class="ghost" data-action="next" aria-label="下一方案">→</button><span class="divider"></span><button class="ghost state-button" data-action="state">查看规则</button></div>

<dialog id="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="actions"><button data-action="dialog-close">知道了</button></div></dialog>
<script>
const icons={terminal:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'};
const icon=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>';
document.querySelector('#terminal-icon').innerHTML=icon('terminal');document.querySelector('#source-icon').innerHTML=icon('terminal');document.querySelector('#lock-icon').innerHTML=icon('lock');
const samples=[{key:'GH_TOKEN',value:'demo_github_token_not_a_real_secret',sensitive:true},{key:'NPM_TOKEN',value:'demo_npm_token_not_a_real_secret',sensitive:true},{key:'DATABASE_URL',value:'postgres://demo:example@db.example.invalid/app',sensitive:true},{key:'NODE_ENV',value:'development'},{key:'LANG',value:'zh_CN.UTF-8'},{key:'PATH',value:'/opt/homebrew/bin:/usr/local/bin:…',critical:true},{key:'TEAM_CONTEXT',value:'work'}];
const selected=new Set(['GH_TOKEN','NPM_TOKEN','DATABASE_URL']);const custom=new Set();const revealed=new Set();let additions=[];let tab='block';let query='';let filter='all';let step=1;let showNew=false;let source='local';let toastTimer;
const variants=['A','B','C'];let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';
const names={A:'勾选列表 · 推荐',B:'左右移入 / 移出',C:'分步检查'};
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allRows=()=>[...samples,...[...custom].filter(key=>!samples.some(row=>row.key===key)).map(key=>({key,missing:true,value:''}))];
const rows=()=>allRows().filter(row=>(source!=='none'||selected.has(row.key)||custom.has(row.key))&&row.key.toLowerCase().includes(query.toLowerCase())&&(filter==='all'||filter==='selected'&&selected.has(row.key)||filter==='sensitive'&&row.sensitive));
function valueCell(row){if(row.missing||source==='none')return '<span class="muted small">未在当前快照中观察到</span>';if(source==='remote')return '<span class="muted small">值留在启动端</span>';if(row.sensitive)return '<span class="value"><code class="'+(revealed.has(row.key)?'':'mask')+'">'+(revealed.has(row.key)?escape(row.value):'••••••••')+'</code><button class="icon ghost" data-reveal="'+row.key+'" aria-label="'+(revealed.has(row.key)?'隐藏':'显示')+' '+row.key+' 的示例值">'+icon('eye')+'</button></span>';return '<span class="value"><code title="'+escape(row.value)+'">'+escape(row.value)+'</code></span>';}
const mark=row=>'<input class="checkbox" type="checkbox" data-key="'+escape(row.key)+'" aria-label="不传入 '+escape(row.key)+'" '+(selected.has(row.key)?'checked':'')+'>';
const tag=row=>row.sensitive?'<span class="pill warn">疑似凭据</span>':row.critical?'<span class="pill">影响工具查找</span>':row.missing?'<span class="pill">手动规则</span>':'<span class="muted small">普通变量</span>';
const tools=()=>'<div class="toolbar"><label class="search">'+icon('search')+'<input id="search" placeholder="搜索变量名" aria-label="搜索变量名" value="'+escape(query)+'"></label><select id="filter" aria-label="筛选变量"><option value="all" '+(filter==='all'?'selected':'')+'>全部变量</option><option value="sensitive" '+(filter==='sensitive'?'selected':'')+'>疑似凭据</option><option value="selected" '+(filter==='selected'?'selected':'')+'>已选屏蔽</option></select><button data-action="suggest">勾选疑似凭据</button></div>';
function bottomTools(){return '<div class="lower-tools"><button class="ghost" data-action="manual">＋ 按名称添加屏蔽规则</button><span>未勾选的变量仍会继承</span></div>'+(showNew?'<form id="manual-form" class="new-name"><input class="plain-input" name="key" aria-label="手动屏蔽的变量名" placeholder="例如 STRIPE_API_KEY" autocomplete="off"><button type="submit">添加</button></form>':'');}
function VariantA(){return '<div class="section-intro"><h2>勾选不想传入的变量</h2><p>敏感值默认隐藏，可逐项查看。</p></div>'+tools()+'<div class="grid"><table><thead><tr><th>不传入</th><th>变量名</th><th>当前值</th><th>提示</th></tr></thead><tbody>'+rows().map(row=>'<tr class="'+(selected.has(row.key)?'selected':'')+'"><td>'+mark(row)+'</td><td class="key mono">'+escape(row.key)+'</td><td>'+valueCell(row)+'</td><td>'+tag(row)+'</td></tr>').join('')+'</tbody></table>'+(rows().length?'':'<div class="empty">没有匹配的变量；也可以按名称添加规则。</div>')+'</div>'+bottomTools();}
function VariantB(){const card=row=>'<div class="transfer-row"><div class="info"><code>'+escape(row.key)+'</code><div class="value">'+valueCell(row)+'</div></div><button class="icon ghost" data-toggle="'+escape(row.key)+'" aria-label="'+(selected.has(row.key)?'恢复传入 ':'屏蔽 ')+escape(row.key)+'">'+(selected.has(row.key)?'←':'→')+'</button></div>';return '<div class="section-intro"><h2>把要屏蔽的变量移到右侧</h2></div>'+tools()+'<div class="split"><div class="bucket"><div class="bucket-title">继续传入 <span class="muted">'+allRows().filter(row=>!selected.has(row.key)).length+'</span></div>'+rows().filter(row=>!selected.has(row.key)).map(card).join('')+'</div><div class="bucket blocked"><div class="bucket-title">不传给 Agent <span>'+selected.size+'</span></div>'+rows().filter(row=>selected.has(row.key)).map(card).join('')+(selected.size?'':'<div class="empty">从左侧选择要屏蔽的变量</div>')+'</div></div>'+bottomTools();}
function VariantC(){let result='<div class="steps"><span class="'+(step===1?'active':'')+'">① 检查变量</span><span class="line"></span><span class="'+(step===2?'active':'')+'">② 确认结果</span></div>';if(step===1){result+='<section class="review-card"><h3>先检查可能含凭据的变量</h3><p>按名称提示，不代表内容一定敏感。勾选后不会传给 Agent。</p>'+rows().filter(row=>row.sensitive).map(row=>'<label class="check-card">'+mark(row)+'<code>'+escape(row.key)+'</code><span class="mask">••••••••</span></label>').join('')+'</section><details class="review-card"><summary>其他变量 · '+allRows().filter(row=>!row.sensitive).length+' 项</summary>'+rows().filter(row=>!row.sensitive).map(row=>'<label class="check-card">'+mark(row)+'<code>'+escape(row.key)+'</code></label>').join('')+'</details>'+bottomTools();}else{result+='<div class="review-columns"><section class="review-card"><h3 class="blue">不传入 · '+selected.size+' 项</h3>'+[...selected].map(key=>'<div class="review-key">'+escape(key)+'</div>').join('')+'</section><section class="review-card"><h3>继续传入</h3>'+allRows().filter(row=>!selected.has(row.key)).map(row=>'<div class="review-key">'+escape(row.key)+'</div>').join('')+'<p style="margin-top:12px">未匹配规则的新变量，也会继续继承。</p></section></div><button class="ghost" style="margin-top:14px" data-action="step-back">← 返回检查</button>';}return result;}
function setView(){return '<div class="section-intro"><h2>添加或覆盖变量</h2><p>按名称设置启动值，不修改系统环境。</p></div>'+additions.map((row,index)=>'<div class="set-row"><label><span class="form-label">变量名</span><input class="plain-input mono" data-set-key="'+index+'" value="'+escape(row.key)+'" placeholder="TEAM_CONTEXT"></label><label><span class="form-label">值</span><input class="plain-input mono" type="password" data-set-value="'+index+'" value="'+escape(row.value)+'" placeholder="仅填写示例值"></label><button class="icon ghost" data-remove-set="'+index+'" aria-label="移除设置">×</button></div>').join('')+(additions.length?'':'<div class="empty">没有额外设置。现有变量按屏蔽规则处理。</div>')+'<button class="ghost blue" style="margin-top:12px" data-action="add-set">＋ 添加变量</button><div class="callout">同一个变量不能同时设置和屏蔽。真实功能应在保存前明确提示冲突。</div>';}
function render(){document.querySelector('#content').innerHTML=tab==='set'?setView():({A:VariantA,B:VariantB,C:VariantC}[variant])();document.querySelector('#tab-count').textContent=selected.size;document.querySelector('#set-count').textContent=additions.length;document.querySelector('#block-tab').classList.toggle('active',tab==='block');document.querySelector('#set-tab').classList.toggle('active',tab==='set');document.querySelector('#variant-label').innerHTML=variant+' — '+names[variant]+'<small>交互草图 · ← → 切换方案</small>';document.querySelector('#summary').innerHTML='已选 <strong>'+selected.size+'</strong> 项不传入'+(additions.length?' · 设置 '+additions.length+' 项':'')+'<small>发布策略后，下次启动生效；不修改系统环境。</small>';document.querySelector('#save').textContent=variant==='C'&&tab==='block'&&step===1?'下一步 · 确认结果':'保存到策略草稿';document.querySelector('#path-warning').innerHTML=selected.has('PATH')?'<div class="path-warning">屏蔽 PATH 可能使 Agent 无法找到 git、node 等工具。</div>':'';}
function showToast(message){clearTimeout(toastTimer);document.querySelector('#toast').textContent=message;toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',3200);}
function modal(title,body){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-body').innerHTML=body;document.querySelector('#dialog').showModal();}
function state(){return {prototype:true,variant,snapshotSource:source,deleteEnv:[...selected].sort(),setEnv:Object.fromEntries(additions.map(row=>[row.key,row.value])),scope:'new_agent_processes_after_policy_publish',defaultForUnlistedVariables:'inherit'};}
function switchVariant(delta){variant=variants[(variants.indexOf(variant)+delta+variants.length)%variants.length];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);step=1;render();console.info('PROTOTYPE STATE',state());}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.tab){tab=button.dataset.tab;render();return;}if(button.dataset.reveal){const key=button.dataset.reveal;revealed.has(key)?revealed.delete(key):revealed.add(key);render();return;}if(button.dataset.toggle){const key=button.dataset.toggle;selected.has(key)?selected.delete(key):selected.add(key);render();return;}if(button.dataset.removeSet!==undefined){additions.splice(Number(button.dataset.removeSet),1);render();return;}switch(button.dataset.action){case'prev':switchVariant(-1);break;case'next':switchVariant(1);break;case'state':modal('当前草图中的规则','<p>仅用于评审，未写入应用或服务器。</p><pre>'+escape(JSON.stringify(state(),null,2))+'</pre>');break;case'help':modal('作用范围与安全边界','<p>只控制子进程环境变量的继承，不会修改你的系统环境。已运行的 Agent 不会因此改变。</p><p>这不是文件或进程沙箱，不能阻止 Agent 从配置文件等其他来源读取同一份秘密。</p><p>按变量名保存屏蔽规则；未匹配规则的新变量仍会继承。疑似凭据提示不保证找出全部秘密。</p><p>来源必须是实际启动端的快照。远程场景只展示变量名和脱敏状态，不能用 Web 服务器环境代替。</p>');break;case'dialog-close':document.querySelector('#dialog').close();break;case'cancel':showToast('这是设计草图；没有修改任何应用配置。');break;case'refresh':showToast('已刷新示例快照。真实功能需从实际启动端获取。');break;case'suggest':samples.filter(row=>row.sensitive).forEach(row=>selected.add(row.key));render();break;case'manual':showNew=!showNew;render();if(showNew)document.querySelector('[name=key]').focus();break;case'add-set':additions.push({key:'',value:''});render();break;case'step-back':step=1;render();break;case'save':if(variant==='C'&&tab==='block'&&step===1){step=2;render();break;}if(additions.some(row=>selected.has(row.key))){showToast('同一变量不能同时设置和屏蔽，请先取消其中一项。');break;}modal('预览保存结果','<p>草图没有真正保存。正式流程先保存到策略草稿，发布后对新启动的 Agent 生效。</p><pre>'+escape(JSON.stringify(state(),null,2))+'</pre>');break;}});
document.addEventListener('change',event=>{if(event.target.matches('[data-key]')){event.target.checked?selected.add(event.target.dataset.key):selected.delete(event.target.dataset.key);render();}if(event.target.id==='filter'){filter=event.target.value;render();}if(event.target.id==='source'){source=event.target.value;revealed.clear();render();}});
document.addEventListener('input',event=>{if(event.target.id==='search'){const position=event.target.selectionStart;query=event.target.value;render();const input=document.querySelector('#search');input.focus();input.setSelectionRange(position,position);}if(event.target.dataset.setKey!==undefined)additions[Number(event.target.dataset.setKey)].key=event.target.value;if(event.target.dataset.setValue!==undefined)additions[Number(event.target.dataset.setValue)].value=event.target.value;});
document.addEventListener('submit',event=>{if(event.target.id!=='manual-form')return;event.preventDefault();const name=new FormData(event.target).get('key').trim();if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)){showToast('请填写合法变量名，例如 STRIPE_API_KEY。');return;}if(/^(VIBERMATE_|HTTP_PROXY$|HTTPS_PROXY$|ALL_PROXY$|NO_PROXY$|SSL_CERT_FILE$|OPENAI_|CODEX_|ANTHROPIC_)/i.test(name)){showToast('此变量由运行时管理，不能在这里屏蔽。');return;}custom.add(name);selected.add(name);showNew=false;query='';filter='all';render();});
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]')||document.querySelector('#dialog').open)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();switchVariant(event.key==='ArrowLeft'?-1:1);}});
render();console.info('PROTOTYPE STATE',state());
</script>
</body>
</html>
